name: Import ResponseFirst Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import dashboard source
        run: |
          git clone --depth 1 https://github.com/varunmodi2004-arch/Responsefirst-dashboard.git /tmp/dashboard
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/dashboard/. .
          rm -rf .git /tmp/dashboard
          rm -f .github/workflows/import-dashboard.yml

      - name: Commit dashboard as standalone repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ResponseFirst dashboard as standalone app" || exit 0
          git push origin HEAD:main
